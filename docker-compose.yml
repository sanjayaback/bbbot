services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docuquery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/local_bootstrap.sql:/docker-entrypoint-initdb.d/00-auth.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d docuquery"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/docuquery
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /data/uploads
    ports: ["8000:8000"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: ["rq","worker","docuquery","--url","redis://redis:6379/0"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/docuquery
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    ports: ["3310:3310"]
volumes:
  pgdata:
  uploads:
