name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pip/wheels
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Run tests
      run: |
        mkdir -p reports
        python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml

    - name: Upload junit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.python-version }}
        path: reports/junit-${{ matrix.python-version }}.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production source archive
        run: |
          mkdir -p dist
          zip -r dist/docuquery-production-fixed.zip . \
            -x '.git/*' 'dist/*' '.env' '.venv/*' '__pycache__/*' '*.pyc'
      - name: Upload production source archive
        uses: actions/upload-artifact@v4
        with:
          name: docuquery-production-fixed
          path: dist/docuquery-production-fixed.zip
          if-no-files-found: error
          retention-days: 14
