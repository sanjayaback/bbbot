name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/poetry.lock','**/requirements.txt','**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        elif [ -f pyproject.toml ]; then pip install poetry && poetry export -f requirements.txt --without-hashes -o requirements.txt || true && pip install -r requirements.txt
        else pip install -e . || true; fi

    - name: Lint (flake8)
      run: |
        if python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('flake8') else 1)"; then
          flake8 || true
        else
          echo 'flake8 not installed, skipping'
        fi

    - name: Run tests
      run: |
        mkdir -p reports
        python -m pytest -q --junitxml=reports/junit-${{ matrix.python-version }}.xml

    - name: Upload junit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.python-version }}
        path: reports/junit-${{ matrix.python-version }}.xml
